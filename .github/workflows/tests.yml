# Adapted from https://docs.astral.sh/uv/guides/integration/github/#using-uv-in-github-actions

name: "Tests"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request: ~

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: 3.15.2
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.13.10

jobs:
  run-django-tests:
    name: python manage.py test --parallel --shuffle
    runs-on: ubuntu-26.04
    environment: gha-tests
    timeout-minutes: 1

    services:
      postgres:
        image: postgres:19.0-alpine3.24@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
      redis:
        image: redis:8.12.0-alpine3.23@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        name: Checkout
        with:
          persist-credentials: false

      - name: Install uv ${{ env.UV_VERSION }} & Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # The default value is "auto" and it resolves to "true" in Github-hosted runners, but explicit is better.
          enable-cache: true
          # uv can install Python, no need for actions/setup-python
          # https://github.com/astral-sh/setup-uv?tab=readme-ov-file#do-i-still-need-actionssetup-python-alongside-setup-uv
          # https://github.com/astral-sh/setup-uv?tab=readme-ov-file#python-version
          python-version: ${{ env.PYTHON_VERSION }}
          version: ${{ env.UV_VERSION }}

      - name: Install packages
        run: uv sync --frozen --no-install-project

      - name: Run tests
        working-directory: ./src
        env:
          ALLOWED_HOSTS: "*"
          APP_REDIS_URL: "redis://localhost:${{ job.services.redis.ports[6379] }}/1"
          CELERY_BROKER_URL: ""
          CELERY_RESULT_BACKEND: ""
          POSTGRES_DB_HOST: "localhost"
          POSTGRES_DB_NAME: "postgres"
          POSTGRES_DB_USER: "postgres"
          POSTGRES_DB_PASSWORD: "postgres"
          POSTGRES_DB_PORT: "${{ job.services.postgres.ports[5432] }}"
          SECRET_KEY: "unsecure_secret_key_for_tests"
          USE_SSL: "false"
        run: |
          uv run python manage.py wait_for_db
          uv run python manage.py wait_for_cache
          uv run coverage run manage.py test --parallel --shuffle
          uv run coverage report
          uv run coverage xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
